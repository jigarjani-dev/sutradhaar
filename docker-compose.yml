services:
  gateway:
    build: .
    ports:
      - "8192:8192"
    volumes:
      - ./data:/app/data
      - ./credentials:/root/.config/gws
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - searxng
      - mcp-searxng
    restart: unless-stopped

  # Privacy-respecting search engine (JSON API on for MCP).
  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped

  # Official mcp-searxng image in Streamable HTTP mode — paste its /mcp URL in Skills.
  mcp-searxng:
    image: docker.io/isokoliuk/mcp-searxng:latest
    environment:
      SEARXNG_URL: http://searxng:8080
      MCP_HTTP_PORT: "3000"
      MCP_HTTP_HOST: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - searxng
    restart: unless-stopped
