services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./credentials:/root/.config/gws
    env_file:
      - .env
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
    restart: unless-stopped
